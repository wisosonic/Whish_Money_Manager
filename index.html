<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply the saved interface language (wmm_lang cookie) and theme (wmm_theme) before the first paint, so English
         users don't see a right-to-left flash. Arabic is the default; src/lib/i18n.jsx takes over. -->
    <script>
      try {
        if (/(?:^|;\s*)wmm_lang=en(?:;|$)/.test(document.cookie)) {
          document.documentElement.lang = "en";
          document.documentElement.dir = "ltr";
        }
        // Dark mode before the first paint (the signed-in user's theme, mirrored by PreferencesContext).
        var theme = (document.cookie.match(/(?:^|;\s*)wmm_theme=(light|dark|system)(?:;|$)/) || [])[1];
        if (theme === "dark" || (theme === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
    <!-- Vite resolves this path and serves a fingerprinted copy of the logo in the build. -->
    <link rel="icon" type="image/png" href="/src/assets/images/logo.png" />
    <link rel="apple-touch-icon" href="/src/assets/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Whish Money Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
